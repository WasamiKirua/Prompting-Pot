services:
  prompting-pot:
    build: .
    image: prompting-pot:0.1.0
    init: true
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${CONFIG_DIR:-./config}
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODELS_DIR:-/mnt/llm/models}
        target: /mnt/llm/models
        read_only: true
        bind:
          create_host_path: false
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 45s
